name: Nightly differential and fuzz tests

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-and-fuzz:
    runs-on: ubuntu-latest
    env:
      # bbpPairings v6.0.0
      BBP_COMMIT: 16a000f9811de322b0e835d5643198226165b5a9
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6
        with:
          go-version: stable
          cache: false

      - name: Build bbpPairings 6.0
        shell: bash
        run: |
          git clone https://github.com/BieremaBoyzProgramming/bbpPairings.git /tmp/bbpPairings
          cd /tmp/bbpPairings
          git checkout "$BBP_COMMIT"
          make -j"$(nproc)"
          mkdir -p "$HOME/.local/bin"
          cp bbpPairings.exe "$HOME/.local/bin/bbpPairings"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          out="$("$HOME/.local/bin/bbpPairings" 2>&1 || true)"
          echo "$out" | head -1
          grep -q 'v6.0.0' <<<"$out"

      - name: Dutch differential harness
        shell: bash
        env:
          HARNESS_N: 150
          HARNESS_SEED: 1001
          HARNESS_OUT: ${{ runner.temp }}/harness-differences
        run: go test -tags harness ./internal/harness/ -count=1

      - name: Upload harness differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-differences
          path: ${{ runner.temp }}/harness-differences
          if-no-files-found: ignore

      - name: Fuzz TRF reader and pairers
        shell: bash
        run: |
          for package in trf pairing/burstein pairing/doubleswiss pairing/dubov pairing/dutch pairing/keizer pairing/lim pairing/roundrobin pairing/team; do
            go test "./$package" -run '^$' -fuzz '^Fuzz' -fuzztime=10s
          done
