name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: docs/go.mod
          cache-dependency-path: docs/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Docsy compiles its SCSS with Dart Sass, which Hugo finds as `sass` on the PATH.
      - name: Install npm dependencies and Dart Sass
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
        working-directory: docs

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
          extended: true

      - name: Diagnose Dart Sass
        working-directory: docs
        run: |
          node -v
          which sass || true
          ls -la node_modules/.bin | grep -i sass || true
          ls node_modules | grep -i "^sass" || true
          ls node_modules/@sass-embedded 2>/dev/null | head || true
          sass --version || true
          echo "--- embedded protocol probe"
          (printf '' | sass --embedded; echo "exit=$?") 2>&1 | head -5 || true
          file "$(readlink -f node_modules/.bin/sass)" || true

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release view --json tagName -q .tagName)
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Build
        run: hugo build --minify
        working-directory: docs
        env:
          HUGO_PARAMS_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
